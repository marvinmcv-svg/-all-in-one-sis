<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearPath</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; width: 300px; background: #f0fdf4; color: #111827; }
    .header { background: #16a34a; color: white; padding: 12px 16px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }
    #stats { display: flex; gap: 16px; padding: 12px 16px; background: white; border-bottom: 1px solid #e5e7eb; }
    .stat { text-align: center; }
    .num { display: block; font-size: 20px; font-weight: 700; color: #16a34a; }
    .label { font-size: 11px; color: #6b7280; }
    #form { padding: 16px; }
    #form label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
    select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
    .btn-row { display: flex; gap: 8px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    #beat-it { background: #16a34a; color: white; }
    #used { background: #fef2f2; color: #dc2626; border: 1px solid #fca5a5; }
    #success { padding: 24px; text-align: center; display: none; }
    #success .emoji { font-size: 32px; }
    #success p { font-size: 14px; color: #374151; margin-top: 8px; }
    #login { padding: 24px; text-align: center; }
    #login a { color: #16a34a; font-size: 14px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ClearPath</h1>
    <p>Quick craving log</p>
  </div>

  <div id="stats"></div>

  <div id="form">
    <label for="intensity">How intense?</label>
    <select id="intensity">
      <option value="LOW">Low</option>
      <option value="MEDIUM" selected>Medium</option>
      <option value="HIGH">High</option>
      <option value="OVERWHELMING">Overwhelming</option>
    </select>
    <div class="btn-row">
      <button id="beat-it">Beat It 💪</button>
      <button id="used">I Used 😔</button>
    </div>
  </div>

  <div id="success">
    <div class="emoji">✅</div>
    <p>Craving logged. Keep going!</p>
  </div>

  <div id="login" class="hidden">
    <a href="https://clearpath.app/sign-in" target="_blank">Sign in to ClearPath →</a>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
